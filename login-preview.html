<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - ElectroMTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-dark: #072553;
            --brand-light: #14e6f4;
            --brand-orange: #ff6b00;
            --text-dark: #333333;
            --text-light: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--brand-dark) 0%, #0a3670 50%, #1a4a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(20, 230, 244, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.1) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* Login Container */
        .login-container {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 90px;
            height: 90px;
            background: var(--brand-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 30px rgba(7, 37, 83, 0.3);
        }

        .logo-icon i {
            font-size: 40px;
            color: var(--brand-light);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: var(--brand-dark);
            letter-spacing: 2px;
        }

        /* Form */
        .login-form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            background: #f8f9fa;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--brand-light);
            background: white;
            box-shadow: 0 0 0 4px rgba(20, 230, 244, 0.15);
            outline: none;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
        }

        .password-toggle:hover {
            color: var(--brand-dark);
        }

        /* Remember me */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            accent-color: var(--brand-orange);
            cursor: pointer;
        }

        .remember-me span {
            font-size: 14px;
            color: var(--text-light);
        }

        .forgot-password {
            font-size: 14px;
            color: var(--brand-dark);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password:hover {
            color: var(--brand-orange);
        }

        /* Submit button */
        .btn-login {
            width: 100%;
            padding: 16px 30px;
            background: linear-gradient(135deg, var(--brand-orange) 0%, #ff8533 100%);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.35);
            font-family: inherit;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #e55a00 0%, var(--brand-orange) 100%);
            box-shadow: 0 12px 35px rgba(255, 107, 0, 0.45);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--text-light);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
        }

        /* Social login */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            font-family: inherit;
        }

        .btn-social:hover {
            border-color: var(--brand-light);
            background: #f8f9fa;
        }

        .btn-social.google i { color: #ea4335; }
        .btn-social.facebook i { color: #1877f2; }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .login-footer p {
            font-size: 14px;
            color: var(--text-light);
        }

        .login-footer a {
            color: var(--brand-orange);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Tagline */
        .tagline {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        /* Back to site */
        .back-to-site {
            text-align: center;
            margin-top: 15px;
        }

        .back-to-site a {
            font-size: 14px;
            color: var(--text-light);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-to-site a:hover {
            color: var(--brand-orange);
        }

        /* Error message */
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border-left: 4px solid #dc3545;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #dc3545;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Success message */
        .success-message {
            background: rgba(40, 167, 69, 0.1);
            border-left: 4px solid #28a745;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #28a745;
            display: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 30px 25px;
                margin: 20px;
            }

            .logo-icon {
                width: 70px;
                height: 70px;
            }

            .logo-icon i {
                font-size: 30px;
            }

            .logo-text {
                font-size: 22px;
            }

            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Logo -->
    <div class="logo">
        <div class="logo-icon">
            <i class="fas fa-bolt"></i>
        </div>
        <div class="logo-text">ELECTROMTI</div>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        Usuario o contraseña incorrectos
    </div>

    <!-- Login Form -->
    <form class="login-form" id="loginForm">
        <div class="form-group">
            <label for="username">Usuario o correo electrónico</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Introduce tu usuario" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required>
                <button type="button" class="password-toggle" onclick="togglePassword()">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>

        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" name="remember">
                <span>Recuérdame</span>
            </label>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> Acceder
        </button>
    </form>

    <!-- Divider -->
    <div class="divider">
        <span>o continúa con</span>
    </div>

    <!-- Social Login -->
    <div class="social-login">
        <button type="button" class="btn-social google">
            <i class="fab fa-google"></i>
            Google
        </button>
        <button type="button" class="btn-social facebook">
            <i class="fab fa-facebook-f"></i>
            Facebook
        </button>
    </div>

    <!-- Footer -->
    <div class="login-footer">
        <p>¿No tienes una cuenta? <a href="#">Regístrate</a></p>
    </div>

    <!-- Tagline -->
    <div class="tagline">
        Tu tienda de electrónica de confianza
    </div>

    <!-- Back to site -->
    <div class="back-to-site">
        <a href="electromti-preview.html">
            <i class="fas fa-arrow-left"></i>
            Volver a ElectroMTI
        </a>
    </div>
</div>

<script>
    // Toggle password visibility
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    }

    // Form submission (demo)
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Demo: show error for empty fields
        if (!username || !password) {
            document.getElementById('errorMessage').classList.add('show');
            return;
        }

        // Demo: simulate login
        const btn = document.querySelector('.btn-login');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Accediendo...';
        btn.disabled = true;

        setTimeout(() => {
            // Redirect or show success
            alert('¡Login exitoso! (Demo)');
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Acceder';
            btn.disabled = false;
        }, 2000);
    });
</script>

</body>
</html>
